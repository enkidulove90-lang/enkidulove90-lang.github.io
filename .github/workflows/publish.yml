name: Build & Publish (Notion -> Hexo -> Pages)

on:
  schedule:
    - cron: '0,30 * * * *'        # 每 30 分钟（GitHub 定时有延迟/偶发跳跑，属正常）
  workflow_dispatch:              # 手动立即构建
  repository_dispatch:            # 预留：Notion webhook -> Worker -> 此事件，分钟级实时
    types: [notion-updated]

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: source

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Quality gate
        run: |
          npm ci || npm install
          npm test
          pip install --quiet requests Pillow pyyaml PyMuPDF
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Sync Notion -> Markdown
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_PAGE_ID: ${{ github.event.client_payload.notion_page_id }}
        run: |
          pip install --quiet requests
          python tools/notion_sync.py

      - name: Build cached paper-map places
        run: python tools/build_places.py

      - name: Install deps
        run: npm ci || npm install

      - name: Build
        env:
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
          PAPER_INTAKE_API_BASE: ${{ secrets.PAPER_INTAKE_API_BASE }}
          TARGET_SLUG: ${{ github.event.client_payload.slug }}
        run: |
          rebuild_site() {
            npx hexo clean
            npx hexo generate
            test -f public/index.html
            if [ -n "$TARGET_SLUG" ]; then
              test -f "public/article/$TARGET_SLUG/index.html"
            fi
          }
          rebuild_site

      - name: Persist incremental Notion mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- tools/.notion_state.json source/_posts source/images source/papers source/_data/places.json
          if ! git diff --cached --quiet; then
            git commit -m "content: sync Notion incrementally"
            git push origin HEAD:source
          fi

      - name: Keep .nojekyll
        run: touch public/.nojekyll

      - name: Publish to main
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: main
          publish_dir: ./public
          force_orphan: false
          commit_message: "Publish: ${{ github.event_name }} @ ${{ github.sha }}"

      - name: Post-deploy smoke test
        env:
          SITE_BASE_URL: https://enkidulove90-lang.github.io
          PAPER_INTAKE_API_BASE: ${{ secrets.PAPER_INTAKE_API_BASE }}
        run: python tools/post_deploy_smoke.py

      - name: Report paper intake deployment
        if: ${{ always() && github.event_name == 'repository_dispatch' && github.event.client_payload.job_id != '' }}
        env:
          CALLBACK_URL: ${{ secrets.PAPER_INTAKE_CALLBACK_URL }}
          CALLBACK_TOKEN: ${{ secrets.PAPER_INTAKE_CALLBACK_TOKEN }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          if [ "$DEPLOY_STATUS" = "success" ]; then
            OK=true
          else
            OK=false
          fi
          curl --fail-with-body --retry 3 --retry-all-errors \
            --request POST "$CALLBACK_URL/v1/publications/callback" \
            --header "Authorization: Bearer $CALLBACK_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"job_id\":\"$JOB_ID\",\"ok\":$OK,\"git_commit\":\"${GITHUB_SHA}\"}"
