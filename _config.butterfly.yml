# Butterfly 主题覆盖配置（优先级高于主题默认 _config.yml）

# 左侧竖排导航（对齐 recsys-frontier：4 个索引页 + 2 个分类快捷入口）
menu:
  首页: / || fas fa-home
  历史归档: /archives/ || fas fa-box-archive
  文章分类: /categories/ || fas fa-folder-open
  文章标签: /tags/ || fas fa-tags
  多模态推荐: /categories/多模态推荐/ || fas fa-images
  知识图谱推荐: /categories/知识图谱推荐/ || fas fa-diagram-project
  旧站存档: /legacy/ || fas fa-clock-rotate-left

# 头部设置
nav:
  logo:
  display_title: true
  fixed: false

index:
  cover: true
  post_list: true

# 头图 / 封面：全部从在线图库加载，不占本地空间
# picsum.photos 免 key、高清、支持 seed 固定图（实测本机可达）
# 取值链：文章头图 top_img → 没有则回退 cover → 都没有则 default_top_img
default_top_img: https://picsum.photos/seed/recsys-frontier-banner/1920/1080

cover:
  # 首页列表卡片 / 侧栏最新文章 / 归档页 是否显示封面
  index_enable: true
  aside_enable: true
  archives_enable: true
  # 文章未单独指定 cover 时从这里随机取（主题保证最近 3 篇不撞图）
  default_cover:
    - https://picsum.photos/seed/recsys-frontier-01/1200/630
    - https://picsum.photos/seed/recsys-frontier-02/1200/630
    - https://picsum.photos/seed/recsys-frontier-03/1200/630
    - https://picsum.photos/seed/recsys-frontier-04/1200/630
    - https://picsum.photos/seed/recsys-frontier-05/1200/630
    - https://picsum.photos/seed/recsys-frontier-06/1200/630
    - https://picsum.photos/seed/recsys-frontier-07/1200/630
    - https://picsum.photos/seed/recsys-frontier-08/1200/630

# 侧栏（右侧保留 公告/最新发布/标签 + 作者/分类/归档/网站信息）
aside:
  enable: true
  hide: false
  card_author:
    enable: true
  card_announcement:
    enable: true
    content: 推荐系统内容分享库 · 内容源自 Notion，每 30 分钟自动同步
  card_recent_post:
    enable: true
    limit: 6
  card_categories:
    enable: true
    limit: 9
  card_tags:
    enable: true
    limit: 18
    color: false
  card_archives:
    enable: true
  card_webinfo:
    enable: true

# 分享（改用 AddToAny：平台覆盖比 sharejs 全，且原生支持
# 复制链接 / 邮箱 / 微信二维码 / 移动端调起系统分享 / 「更多」展开按钮）
share:
  use: addtoany
  addtoany:
    # 顺序即展示顺序；a2a_dd 展开按钮由主题模板自动追加在末尾
    item: copy_link,wechat,qq,sina_weibo,email,facebook,x,telegram,facebook_messenger,line,reddit,whatsapp,linkedin

# 评论/统计/搜索
search:
  use: local_search
  placeholder:

# 字数统计 / 阅读时长（依赖 hexo-wordcount，已加入 package.json）
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# 自定义注入：竖排左栏导航样式 + 分类/标签列表样式 + 分享栏样式
inject:
  head:
    - <link rel="stylesheet" href="/css/left-nav.css">
    - <link rel="stylesheet" href="/css/pages.css">
    - <link rel="stylesheet" href="/css/share.css">

footer:
  owner:
    enable: true
    since: 2025
