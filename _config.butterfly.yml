# Butterfly 主题覆盖配置（优先级高于主题默认 _config.yml）

# 左侧竖排导航：按三维分类的「领域大类」组织
# （推荐技术报告=推荐系统域；AI 技术报告=AI 域，含大模型与智能体 / 检索增强生成）
menu:
  首页: / || fas fa-home
  推荐技术报告: /categories/推荐系统/ || fas fa-chart-line
  AI 技术报告: /categories/AI/ || fas fa-robot
  论文速递: /tags/论文速读/ || fas fa-newspaper
  文章分类: /categories/ || fas fa-folder-open
  文章标签: /tags/ || fas fa-tags
  历史归档: /archives/ || fas fa-box-archive
  旧站存档: /legacy/ || fas fa-clock-rotate-left
  论文足迹: /map/ || fas fa-map-location-dot

# 头部设置
nav:
  logo:
  display_title: true
  fixed: false

index:
  cover: true
  post_list: true

avatar:
  img: /img/avatar-kurisu.jpg
  effect: false

# 头图 / 封面：全部从在线图库加载，不占本地空间
# picsum.photos 免 key、高清、支持 seed 固定图（实测本机可达）
# 取值链：文章头图 top_img → 没有则回退 cover → 都没有则 default_top_img
default_top_img: https://picsum.photos/seed/recsys-frontier-banner/1920/1080.webp

cover:
  # 首页列表卡片 / 侧栏最新文章 / 归档页 是否显示封面
  index_enable: true
  aside_enable: true
  archives_enable: true
  # 文章不再写死封面，全部由这里在「每次构建」随机分配（最近 3 篇不撞图）。
  # 池内 URL 都是固定 seed 的图 → fastly 返回 30 天 immutable 缓存，
  # 所以「构建时随机」不影响加载速度；而每次刷新换图的写法会让缓存永远失效。
  default_cover:
    - https://picsum.photos/seed/recsys-frontier-01/1200/630.webp
    - https://picsum.photos/seed/recsys-frontier-02/1200/630.webp
    - https://picsum.photos/seed/recsys-frontier-03/1200/630.webp
    - https://picsum.photos/seed/recsys-frontier-04/1200/630.webp
    - https://picsum.photos/seed/recsys-frontier-05/1200/630.webp
    - https://picsum.photos/seed/recsys-frontier-06/1200/630.webp
    - https://picsum.photos/seed/recsys-frontier-07/1200/630.webp
    - https://picsum.photos/seed/recsys-frontier-08/1200/630.webp
    - https://picsum.photos/seed/recsys-frontier-09/1200/630.webp
    - https://picsum.photos/seed/recsys-frontier-10/1200/630.webp
    - https://picsum.photos/seed/recsys-frontier-11/1200/630.webp
    - https://picsum.photos/seed/recsys-frontier-12/1200/630.webp
    - https://picsum.photos/seed/recsys-frontier-13/1200/630.webp
    - https://picsum.photos/seed/recsys-frontier-14/1200/630.webp
    - https://picsum.photos/seed/recsys-frontier-15/1200/630.webp
    - https://picsum.photos/seed/recsys-frontier-16/1200/630.webp
    - https://picsum.photos/seed/recsys-frontier-17/1200/630.webp
    - https://picsum.photos/seed/recsys-frontier-18/1200/630.webp
    - https://picsum.photos/seed/recsys-frontier-19/1200/630.webp
    - https://picsum.photos/seed/recsys-frontier-20/1200/630.webp
    - https://picsum.photos/seed/recsys-frontier-21/1200/630.webp
    - https://picsum.photos/seed/recsys-frontier-22/1200/630.webp
    - https://picsum.photos/seed/recsys-frontier-23/1200/630.webp
    - https://picsum.photos/seed/recsys-frontier-24/1200/630.webp

# 侧栏（右侧保留 公告/最新发布/标签 + 作者/分类/归档/网站信息）
aside:
  enable: true
  hide: false
  card_author:
    enable: true
  card_announcement:
    enable: true
    content: 推荐系统内容分享库 · 内容源自 Notion，每 30 分钟自动同步
  card_recent_post:
    enable: true
    limit: 6
  card_categories:
    enable: true
    limit: 9
  card_tags:
    enable: true
    limit: 18
    color: false
  card_archives:
    enable: true
  card_webinfo:
    enable: true

# 分享（改用 AddToAny：平台覆盖比 sharejs 全，且原生支持
# 复制链接 / 邮箱 / 微信二维码 / 移动端调起系统分享 / 「更多」展开按钮）
share:
  use: addtoany
  addtoany:
    # 顺序即展示顺序；a2a_dd 展开按钮由主题模板自动追加在末尾
    item: copy_link,wechat,qq,sina_weibo,email,facebook,x,telegram,facebook_messenger,line,reddit,whatsapp,linkedin

# 评论/统计/搜索
search:
  use: local_search
  placeholder:

# 字数统计 / 阅读时长（依赖 hexo-wordcount，已加入 package.json）
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# 自定义注入：竖排左栏导航样式 + 分类/标签列表样式 + 分享栏样式 + 多维过滤器
inject:
  head:
    - <link rel="stylesheet" href="/css/left-nav.css">
    - <link rel="stylesheet" href="/css/pages.css">
    - <link rel="stylesheet" href="/css/share.css">
    - <link rel="stylesheet" href="/css/filter.css?v=20261021-home-layout-fix">
    - <link rel="stylesheet" href="/css/paper-intake.css">
  bottom:
    - <script defer src="/js/multidim-filter.js?v=20261021-home-layout-fix"></script>
    - <script defer src="/js/paper-intake.js"></script>
    - <script defer src="/js/paper-2610.05432.js?v=math-v6"></script>

footer:
  owner:
    enable: true
    since: 2025
