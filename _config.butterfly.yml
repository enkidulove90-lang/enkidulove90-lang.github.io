# Butterfly 主题覆盖配置（优先级高于主题默认 _config.yml）

# 左侧竖排导航（对齐 recsys-frontier：4 个索引页 + 2 个分类快捷入口）
menu:
  首页: / || fas fa-home
  历史归档: /archives/ || fas fa-box-archive
  文章分类: /categories/ || fas fa-folder-open
  文章标签: /tags/ || fas fa-tags
  多模态推荐: /categories/多模态推荐/ || fas fa-images
  知识图谱推荐: /categories/知识图谱推荐/ || fas fa-diagram-project
  旧站存档: /legacy/ || fas fa-clock-rotate-left

# 头部设置
nav:
  logo:
  display_title: true
  fixed: false

index:
  cover: true
  post_list: true

# 侧栏（卡片放在右侧；左侧由 source/css/left-nav.css 做成常驻竖排导航）
aside:
  enable: true
  hide: false
  card_author:
    enable: true
  card_announcement:
    enable: true
    content: 推荐系统内容分享库 · 内容源自 Notion，每 30 分钟自动同步
  card_recent_post:
    enable: true
    limit: 6
  card_categories:
    enable: true
    limit: 9
  card_tags:
    enable: true
    limit: 18
    color: false

# 评论/统计/搜索
search:
  use: local_search
  placeholder:

# 自定义注入：竖排左栏导航样式
inject:
  head:
    - <link rel="stylesheet" href="/css/left-nav.css">

footer:
  owner:
    enable: true
    since: 2025
