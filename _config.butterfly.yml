# Butterfly 主题覆盖配置（优先级高于主题默认 _config.yml）

# 导航收敛：推荐系统为主，旧内容入口收进「归档」
menu:
  首页: / || fas fa-home
  论文速递: /categories/论文速递/ || fas fa-newspaper
  技术报告: /categories/技术报告/ || fas fa-file-lines
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  归档: /archives/ || fas fa-box-archive
  旧站存档: /legacy/ || fas fa-clock-rotate-left

# 头部设置
nav:
  logo:
  display_title: true
  fixed: false

index:
  cover: true
  post_list: true

# 侧栏
aside:
  enable: true
  hide: false
  position: left
  card_author:
    enable: true
  card_announcement:
    enable: true
    content: 推荐系统内容分享库 · 内容源自 Notion，每 30 分钟自动同步
  card_recent_post:
    enable: true
    limit: 6
  card_categories:
    enable: true
    limit: 9
  card_tags:
    enable: true
    limit: 18
    color: false

# 评论/统计/搜索
search:
  use: local_search
  placeholder:

footer:
  owner:
    enable: true
    since: 2025
