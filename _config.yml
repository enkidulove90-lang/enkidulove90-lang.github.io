# Hexo 主配置 —— enkidulove90-lang.github.io（source 分支）

# 站点
title: Enkidu's RecSys Frontier
subtitle: 推荐系统内容分享库
description: 推荐系统论文速递 / 技术报告 / 实践笔记
keywords: 推荐系统, RecSys, Knowledge Graph, Multimodal
author: Enkidu
language: zh-CN
timezone: Asia/Shanghai

# URL（Pages 根发布，无子路径）
url: https://enkidulove90-lang.github.io
root: /
permalink: article/:title/
permalink_defaults:

# 目录
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render: legacy/**   # 旧站整站原样拷贝，不经 Hexo 渲染

# 写作
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false

# 首页分页
index_generator:
  path: ''
  per_page: 12
  order_by: -date

# 日期格式
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# 归档/分类/标签页
archive_generator:
  per_page: 40
  yearly: true
  monthly: false
category_generator:
  per_page: 20
tag_generator:
  per_page: 20

# 本地搜索（hexo-generator-searchdb → search.xml，构建时生成不入库）
search:
  path: search.xml
  field: post
  content: true
  format: html

# 输出
marked:
  gfm: true
server:
  port: 4000
  compress: true
  header: true

# 主题
theme: butterfly

# 部署（部署由 GitHub Actions 完成，这里仅本地备用）
deploy:
  type: git
  repo: git@github-enkidu:enkidulove90-lang/enkidulove90-lang.github.io.git
  branch: main
